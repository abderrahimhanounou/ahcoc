<style>
*{box-sizing:border-box}body{margin:0;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#251f21;background:#fff;padding-bottom:40px}
header{background:#251f21;color:#fff;padding:16px;font-size:21px;font-weight:700}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;border-bottom:1px solid #eae9ea;background:#fff}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;padding:4px 2px;border:1px solid #eae9ea;border-radius:12px;background:#fff;font:inherit;font-size:13px;line-height:1.2;color:#585254;text-align:center}
nav button .ic{font-size:21px}
nav button.on{color:#fff;background:#251f21;border-color:#251f21;font-weight:700}
main{padding:14px 16px;display:flex;flex-direction:column;gap:14px;max-width:600px;margin:0 auto}
h3{margin:18px 0 0;font-size:18px}label{display:flex;flex-direction:column;gap:4px;color:#585254}
input,select,textarea{min-height:50px;padding:0 12px;border:1px solid #cfcdce;border-radius:10px;font-size:17px;font:inherit;width:100%;background:#fff;color:#251f21}
textarea{padding:10px}
.main{min-height:52px;border:0;border-radius:12px;background:#1f6f5c;font-size:18px;color:#fff;font:inherit;font-weight:700;width:100%}
.sec{background:#fff!important;color:#251f21!important;border:1px solid #251f21!important}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cards div{background:#f6f5f5;border-radius:12px;padding:14px;display:flex;flex-direction:column}
.cards span,small,.note{color:#585254;font-size:13px}.cards b{font-size:18px}.wide{grid-column:1/-1}
.good{color:#2f7d6a}.bad{color:#ed313e}
.line,.item,.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #eae9ea}
.item>div{display:flex;flex-direction:column}.item>div:last-child{align-items:flex-end;text-align:end}
.row{width:100%;background:none;border:0;border-bottom:1px solid #eae9ea;font:inherit;color:#251f21;min-height:48px}
.lnk{background:none;border:0;color:#585254;text-decoration:underline;font:inherit;font-size:14px;min-height:40px;padding:0 6px}.lnk.red{color:#ed313e}
#flash{position:fixed;bottom:16px;left:16px;right:16px;background:#251f21;color:#fff;padding:12px;border-radius:8px;text-align:center;display:none;z-index:9}
.sub{display:flex;gap:6px;overflow-x:auto}.sub button{flex:1 0 auto;min-height:40px;padding:0 12px;border:0;border-bottom:2px solid #eae9ea;background:none;font:inherit;color:#585254}.sub button.on{color:#251f21;border-color:#251f21;font-weight:700}
h2{margin:4px 0 0}.pill{display:inline-block;background:#eae9ea;border-radius:10px;padding:0 8px;font-size:12px;color:#585254}
.grp{background:#f6f3f1;border-radius:6px;padding:8px 10px;margin-top:10px;display:flex;flex-direction:column}.grp small{color:#585254}
.warn{background:#fff4e5;border-radius:8px;padding:10px;font-size:14px}
.ledger{margin:-4px 0 12px;padding:8px 10px;background:#faf8f7;border-radius:6px;font-size:14px;display:flex;flex-direction:column;gap:2px}.pl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed #eae9ea}.pl:last-child{border:0}.pl span{flex:1}.pl .lnk{min-height:32px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;box-sizing:border-box;min-width:0;max-width:100%;width:100%;text-align:start}
.foldh{min-height:44px}.foldh small{color:#585254}.foldbox{border-bottom:1px solid #eae9ea;background:#faf9fa;border-radius:6px;padding:0 8px;margin:2px 0}.foldbox .item:first-of-type{border-bottom:0}
.lock{display:flex;flex-direction:column;gap:14px;padding-top:20px}

function buildStatement(who,id,from,to){
 let name,cols,rows=[],title;const cmp=(a,b)=>a.d===b.d?a.i-b.i:a.d.localeCompare(b.d);
 let ev=[];
 if(who==='c'){const c=cl(id);name=c?c.name:'؟';title='كشف حساب الزبون';const s=clStats(id);
  s.ss.forEach(x=>ev.push({d:x.date,i:x.id,t:x.cycle?'بيع - دورة '+((cyc(x.cycle)||{}).name||''):'بيع - إعادة البيع',kg:x.kg,pr:x.price,tot:saleTot(x),paid:x.paid||0}));
  s.pp.forEach(p=>ev.push({d:p.date,i:1e6+p.id,t:'خلاص',tot:0,paid:p.amount}));
  cols=['التاريخ','البيان','الكيلو','الثمن/كغ','المجموع','خلص','الباقي'];}
 else{const x=D.suppliers.find(y=>y.id===id);name=x?x.name:'؟';title='كشف حساب المورد';const s=supStats(id);
  s.bb.forEach(b=>ev.push({d:b.date,i:b.id,t:'شراء',kg:b.kg,pr:b.price,tot:b.kg*b.price,paid:bP0(b)}));
  s.ce.forEach(e=>ev.push({d:e.date,i:5e5+e.id,t:catOf(e.cat)[1]+' - دورة '+((cyc(e.cycle)||{}).name||''),kg:e.qty,pr:e.price,tot:e.amount,paid:P0(e)}));
  s.pp.forEach(p=>ev.push({d:p.date,i:1e6+p.id,t:'عطيتو',tot:0,paid:p.amount}));
  cols=['التاريخ','البيان','الكيلو','الثمن/كغ','المجموع','عطيت','الباقي'];}
 ev.sort(cmp);let bal=0,tot=0,paid=0,kg=0;const out=[];
 ev.forEach(e=>{if(from&&e.d<from){bal+=e.tot-e.paid;return}if(to&&e.d>to)return;
  if(from&&!out.length&&!out.opening){out.opening=bal;}
 });
 let opening=0;ev.forEach(e=>{if(from&&e.d<from)opening+=e.tot-e.paid});bal=opening;
 if(from&&opening!==0)rows.push(['',from?'رصيد سابق':'','','','','',String(Math.round(opening*100)/100)]);
 ev.forEach(e=>{if(from&&e.d<from)return;if(to&&e.d>to)return;bal+=e.tot-e.paid;tot+=e.tot;paid+=e.paid;kg+=e.kg||0;
  rows.push([e.d,e.t,e.kg!=null?String(e.kg):'',e.pr!=null?String(e.pr):'',e.tot?String(Math.round(e.tot*100)/100):'',e.paid?String(Math.round(e.paid*100)/100):'',String(Math.round(bal*100)/100)])});
 const LR=x=>'\u2066'+x+'\u2069';const period=(from||to)?`الفترة: من ${LR(from||'البداية')} إلى ${LR(to||today())}`:'كل الحركات';
 return {name,title,cols,rows,period,sumLines:[['مجموع الشراء'+(kg?` (${kg} كيلو)`:''),tot],[who==='c'?'مجموع ما خلص':'مجموع ما عطيت',paid],[who==='c'?'الباقي عليه':'الباقي خاصني نعطيه',bal]],opening};
}
async function renderPdf(st){
 const W=1240,H=1754,M=60,RH=54,pages=[];let cv,cx,y;
 const W_=[170,300,110,130,150,130,150];const sc=(W-2*M)/W_.reduce((a,b)=>a+b,0);const cw=W_.map(w=>w*sc);
 const newPage=()=>{cv=document.createElement('canvas');cv.width=W;cv.height=H;cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,W,H);cx.fillStyle='#251f21';
  cx.direction='rtl';cx.textAlign='right';cx.font='bold 52px sans-serif';cx.fillText(st.title+': '+st.name,W-M,100);
  cx.font='30px sans-serif';cx.fillStyle='#585254';cx.fillText(st.period,W-M,150);cx.direction='ltr';cx.textAlign='right';cx.fillText(today(),M+120,150);
  y=200;header();pages.push(cv)};
 const cell=(txt,i,yy,bold)=>{let x=W-M;for(let k=0;k<i;k++)x-=cw[k];const w=cw[i];txt=String(txt);let fs=bold?30:28;cx.font=(bold?'bold ':'')+fs+'px sans-serif';while(cx.measureText(txt).width>w-14&&fs>14){fs-=2;cx.font=(bold?'bold ':'')+fs+'px sans-serif'}
  const arabic=/[\u0600-\u06FF]/.test(txt);cx.direction=arabic?'rtl':'ltr';cx.textAlign=arabic?'right':'center';cx.fillText(txt,arabic?x-8:x-w/2,yy)};
 const header=()=>{cx.fillStyle='#eae9ea';cx.fillRect(M,y,W-2*M,RH);cx.fillStyle='#251f21';st.cols.forEach((c,i)=>cell(c,i,y+37,true));y+=RH};
 newPage();
 st.rows.forEach((r,ri)=>{if(y+RH>H-M-40){newPage()}cx.fillStyle='#251f21';r.forEach((c,i)=>cell(c,i,y+37,false));cx.strokeStyle='#eae9ea';cx.beginPath();cx.moveTo(M,y+RH);cx.lineTo(W-M,y+RH);cx.stroke();y+=RH});
 if(!st.rows.length){cx.fillStyle='#585254';cx.direction='rtl';cx.textAlign='right';cx.font='30px sans-serif';cx.fillText('ما كاين حتى حركة فهاد الفترة',W-M,y+45);y+=RH}
 if(y+260>H-M)newPage();y+=30;
 st.sumLines.forEach((l,i)=>{const last=i===st.sumLines.length-1;cx.fillStyle=last?'#251f21':'#585254';cx.font=(last?'bold 40px':'34px')+' sans-serif';cx.direction='rtl';cx.textAlign='right';cx.fillText(l[0],W-M,y+50);cx.direction='ltr';cx.textAlign='left';cx.fillText(Math.round(l[1]*100)/100+' DH',M,y+50);y+=64});
 const jpgs=[];for(const p of pages){const b=await new Promise(r=>p.toBlob(r,'image/jpeg',0.92));jpgs.push(new Uint8Array(await b.arrayBuffer()))}
 return makePdf(jpgs,W,H);
}
function makePdf(jpgs,w,h){
 const enc=new TextEncoder(),chunks=[],offs=[];let len=0;const push=x=>{const u=typeof x==='string'?enc.encode(x):x;chunks.push(u);len+=u.length};
 const n=jpgs.length;const obj=(i,fn)=>{offs[i]=len;push(`${i} 0 obj\n`);fn();push('\nendobj\n')};
 push('%PDF-1.4\n');
 obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
 obj(2,()=>push(`<< /Type /Pages /Count ${n} /Kids [${jpgs.map((_,i)=>`${3+i*3} 0 R`).join(' ')}] >>`));
